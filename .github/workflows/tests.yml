---
# yamllint disable rule:line-length rule:truthy
name: Test add-on

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize tests
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find add-ons
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

      # Any change under an add-on directory counts (the builder only
      # watches image-affecting files, so test-only PRs would otherwise
      # run no CI at all).
      - name: Get changed add-ons
        id: changed_addons
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          PR_BASE: origin/${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            RANGE="$PR_BASE...HEAD"
          elif [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            RANGE="$BASE_SHA..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "Diff range: $RANGE"

          declare -a changed_addons
          for addon in ${{ steps.addons.outputs.addons }}; do
            if git diff --name-only "$RANGE" | grep -qE "^${addon}/"; then
              changed_addons+=("\"${addon}\",")
            fi
          done

          changed=$(echo ${changed_addons[@]} | rev | cut -c 2- | rev)
          if [[ -n ${changed} ]]; then
            echo "Changed add-ons: $changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "addons=[$changed]" >> "$GITHUB_OUTPUT"
          else
            echo "No add-on had any files changed"
          fi

  test:
    needs: init
    runs-on: ubuntu-latest
    if: needs.init.outputs.changed == 'true'
    name: Test ${{ matrix.addon }} add-on
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJson(needs.init.outputs.changed_addons) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Node 24 to match the agent-base toolchain the add-ons ship with.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Suite discovery, so add-ons without tests skip gracefully:
      # 1. add-on level node:test suites in test/ (no dependencies)
      # 2. bundled packages under rootfs/opt/ that declare a test script
      #    (vitest; openchamber-mcp has none yet and is skipped)
      # 3. self-running python package tests in test/ (no pytest needed)
      - name: Run test suites
        working-directory: ${{ matrix.addon }}
        run: |
          suites=0

          if ls test/*.test.js >/dev/null 2>&1; then
            # Suites under test/ may import bundled code in rootfs/opt/
            # whose dependencies ship only in the built image (mcp-hub's
            # src imports @modelcontextprotocol/sdk and @playwright/mcp).
            # Install the bundled packages first so imports resolve.
            for pkg_lock in rootfs/opt/*/package-lock.json; do
              [[ -e "$pkg_lock" ]] || continue
              echo "::group::npm ci $(dirname "$pkg_lock")"
              (cd "$(dirname "$pkg_lock")" && npm ci --include=dev --no-audit --no-fund)
              echo "::endgroup::"
            done

            echo "::group::node --test test/*.test.js"
            node --test test/*.test.js
            echo "::endgroup::"
            suites=$((suites+1))
          fi

          for pkg_json in rootfs/opt/*/package.json; do
            [[ -e "$pkg_json" ]] || continue
            pkg_dir=$(dirname "$pkg_json")
            if node -e "process.exit(require('./$pkg_json').scripts?.test ? 0 : 1)"; then
              echo "::group::npm test ($pkg_dir)"
              (cd "$pkg_dir" && npm ci --include=dev && npm test)
              echo "::endgroup::"
              suites=$((suites+1))
            fi
          done

          for py in test/test_*.py; do
            [[ -e "$py" ]] || continue
            echo "::group::python3 $py"
            python3 "$py"
            echo "::endgroup::"
            suites=$((suites+1))
          done

          echo "Ran $suites test suite(s) for ${{ matrix.addon }}"

  ## Stable, always-running gate job, mirroring the builder's. Add "Addon
  ## tests passed" as a second required status check for main; docs-only
  ## PRs (where `test` is skipped) still pass, and an `init` failure fails
  ## the gate instead of being silently skipped.
  checks:
    needs: [init, test]
    if: always()
    runs-on: ubuntu-latest
    name: Addon tests passed
    steps:
      - name: Verify pipeline result
        run: |
          echo "init: ${{ needs.init.result }}"
          echo "test: ${{ needs.test.result }}"
          if [[ "${{ needs.init.result }}" != "success" ]] \
             || [[ "${{ needs.test.result }}" == "failure" ]] \
             || [[ "${{ needs.test.result }}" == "cancelled" ]]; then
            echo "Tests did not pass - merge stays blocked."
            exit 1
          fi
          echo "Pipeline passed."
