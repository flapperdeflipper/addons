---
name: AI Usage Proxy
slug: ai_usage_proxy
description: Claude, OpenAI and z.ai subscription usage with account management and MQTT metrics.
url: https://github.com/flapperdeflipper/addons/tree/main/ai_usage_proxy
image: flapperdeflipper/addon-ai-usage-proxy
version: 2.0.0

arch:
  - amd64
init: false
startup: once
boot: auto

hassio_api: true
hassio_role: default
services:
  - mqtt:want

ingress: true
ingress_port: 8237
panel_icon: mdi:progress-clock
panel_admin: true

icon: /icon.png
logo: /logo.png

options:
  poll_interval: 60
  topic_prefix: "claude/usage"
  ai_topic_prefix: "ai/usage"
  discovery: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  poll_interval: int(10,3600)
  topic_prefix: str
  ai_topic_prefix: str
  discovery: bool
  mqtt_host: str?
  mqtt_port: int(1,65535)?
  mqtt_username: str?
  mqtt_password: password?
