---
name: "CouchDB"
slug: couchdb
description: >-
  CouchDB with declarative databases, users and rights. Serves Obsidian
  LiveSync vaults and an agent docstore MCP endpoint. Plain HTTP — put your
  own reverse proxy in front for TLS.
version: "3.9.5"
image: flapperdeflipper/addon-couchdb
url: "https://github.com/flapperdeflipper/addons/tree/master/couchdb"
arch:
  - amd64
startup: services
init: false
ports:
  5984/tcp: 5984
ports_description:
  5984/tcp: "CouchDB HTTP — Obsidian LiveSync and direct Fauxton; add a reverse proxy for TLS"
ingress: true
ingress_port: 5986
ingress_entry: /_utils
panel_icon: mdi:database
panel_title: CouchDB
panel_admin: true
map:
  - app_config:rw
options:
  log_level: info
  databases:
    - obsidian
    - agent_handoffs
    - agent_tasks
    - agent_reports
    - agent_memory
  logins:
    - username: admin
      password: ""
      server_admin: true
    - username: vault
      password: ""
    - username: agent
      password: ""
  rights:
    - database: obsidian
      username: vault
      level: admin
    - database: agent_handoffs
      username: agent
      level: admin
    - database: agent_tasks
      username: agent
      level: admin
    - database: agent_reports
      username: agent
      level: admin
    - database: agent_memory
      username: agent
      level: admin
  cors:
    origins:
      - app://obsidian.md
      - capacitor://localhost
      - http://localhost
  docstore:
    enabled: true
    username: agent
    token: ""
schema:
  log_level: list(debug|info|warn|error)
  databases:
    - str
  logins:
    - username: str
      password: password?
      server_admin: bool?
  rights:
    - database: str
      username: str
      level: list(member|admin)
  cors:
    origins:
      - str?
  docstore:
    enabled: bool
    username: str
    token: password?
