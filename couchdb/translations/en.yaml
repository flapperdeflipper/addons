configuration:
  log_level:
    name: Log level
    description: CouchDB log verbosity.
  databases:
    name: Databases
    description: Databases created (idempotently) on every start. The first must be lowercase; a-z 0-9 _ $ ( ) + / -
  logins:
    name: Logins
    description: CouchDB users. Exactly one entry with admin true is the server administrator; the rest are regular users. Blank passwords are generated and saved under /config/couchdb/users/, never printed to the log.
  rights:
    name: Rights
    description: Per-database grants. Member can read and write documents; admin can additionally manage design documents. Databases with no members stay readable by any authenticated user.
  cors:
    name: CORS
    description: Cross-origin origins allowed by CouchDB. Defaults to the Obsidian LiveSync app origins; empty list disables CORS.
  docstore:
    name: Docstore MCP
    description: Agent document store endpoint (registry-validated doc_* tools plus TTL sweeper) on internal port 5985. Uses the login matching docstore.username; blank token is generated and saved to /config/couchdb/docstore/mcp_token.
