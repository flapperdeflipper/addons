# Home Assistant's Debian base (s6 + Bashio); the Dockerfile adds Node, hab,
# zigporter (both called by MCP tools) and Chromium.
build_from:
  aarch64: ghcr.io/home-assistant/base-debian:trixie
  amd64: ghcr.io/home-assistant/base-debian:trixie
labels:
  org.opencontainers.image.title: "HA MCP"
  org.opencontainers.image.description: "Home Assistant MCP server over HTTP, without configuration writes"
  org.opencontainers.image.source: "https://github.com/flapperdeflipper/addons"
  org.opencontainers.image.licenses: "Unlicense"
  org.opencontainers.image.vendor: "flapperdeflipper"
