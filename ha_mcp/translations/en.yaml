---
# Field order matches the schema block in config.yaml; the Configuration tab
# renders fields in that order.
configuration:
  mcp_http_token:
    name: "MCP bearer token"
    description: "Token MCP clients send as 'Authorization: Bearer <token>'. A !secret <key> value works."

  access_token:
    name: "Home Assistant access token"
    description: "A long-lived access token (Profile -> Long-lived access tokens), for screenshots and the ESPHome Device Builder."

  z2m_url:
    name: "Zigbee2MQTT address"
    description: "The Zigbee2MQTT frontend for zigporter, e.g. http://192.0.2.10:8099. Empty: discover the add-on."

  z2m_mqtt_topic:
    name: "Zigbee2MQTT MQTT topic"
    description: "Zigbee2MQTT's base topic."
