---
name: "OpenChamber"
description: "Browser UI for OpenCode conversations — attaches to the OpenCode add-on's LAN server"
version: "1.3.5"
slug: "ha_openchamber"
image: "flapperdeflipper/addon-ha-openchamber"
url: "https://github.com/flapperdeflipper/addons"
arch:
  - aarch64
  - amd64
startup: application
init: false
# Ingress configuration
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:forum
panel_title: OpenChamber
ports:
  4097/tcp: null
ports_description:
  4097/tcp: "OpenChamber web UI for the trusted reverse proxy — other sources are redirected; Ingress needs no port"
# OpenChamber talks to the OpenCode add-on's LAN server over HTTP and holds no
# Home Assistant API access of its own. Directory mounts mirror the OpenCode
# add-on's so workspace paths behave identically in both containers.
hassio_api: false
homeassistant_api: false
host_network: false
privileged: []
# File access - same mounts as the OpenCode add-on
map:
  - type: homeassistant_config
    read_only: false
  - type: local_apps
    read_only: false
  - type: all_app_configs
    read_only: false
    path: /addon_configs
  - type: share
    read_only: false
# The Configuration tab renders one flat list in schema key order; the grouping
# below is presentation only.
options:
  # --- 1. OpenCode server -----------------------------------------------
  # Address of the OpenCode add-on's LAN server (always on, on 4096/tcp).
  # Leave empty to auto-discover the Docker host gateway — that reaches the
  # published port on any single-host install. Include the scheme but no
  # port, e.g. http://192.168.1.50
  opencode_host: ""
  # Host port that 4096/tcp is mapped to on the OpenCode add-on.
  opencode_port: 4096
  # Basic-auth password for the OpenCode server (username is always
  # 'opencode', the server's default). Required.
  # A !secret <key> value resolves from secrets.yaml at start.
  opencode_password: null
  # --- 2. LAN exposure ----------------------------------------------------
  # Addresses (IP or CIDR) the reverse proxy connects from. Only these and
  # loopback are proxied on 4097/tcp. Empty = loopback only; every other
  # source is rejected and logged with its address — watch the add-on log to
  # discover the proxy's real source IP, then add it here.
  lan_allowed_remotes: []
  # Where untrusted sources are redirected (the public URL behind your OAuth
  # proxy). Empty disables the redirect and refuses with 403 instead.
  lan_redirect_url: ""
  # --- 3. Agent MCP server -----------------------------------------------
  # Expose OpenChamber's project notes, todos and plans to agent clients
  # (e.g. the OpenCode add-on) over streamable HTTP on 4100/tcp on the
  # internal add-on network. Bearer-token authenticated; every call proxies
  # the loopback-only OpenChamber REST API, so no LAN/Ingress allowlist is
  # involved and no project file is read directly.
  mcp_enabled: false
  # Bearer token MCP clients must present as `Authorization: Bearer <token>`.
  # Either a literal token, or a `!secret <key>` reference resolved from
  # secrets.yaml at start (surrounding quotes are stripped, and only the key
  # name is ever logged — the resolved value never lands in options or logs).
  mcp_token: ""
schema:
  opencode_host: str?
  opencode_port: port
  opencode_password: password
  lan_allowed_remotes:
    - str
  lan_redirect_url: str?
  mcp_enabled: bool
  mcp_token: password
# OpenChamber's own settings are small; exclude its npm-owned cache paths.
backup_exclude:
  - ".npm/*"
  - ".npm-global/*"
  - ".cache/*"
