---
# Release CI reads the base image pin below; the canonical devcontainer build
# helper passes every entry under args. Keep the value aligned with the
# Dockerfile ARG default. Home Assistant itself does not read this file because
# config.yaml sets `image:`. See RELEASING.md.
#
# The toolchain layers (node, opencode, ttyd, yq, op/cosign CLIs, unix toolset)
# live in flapperdeflipper/agent-base; releases of that repository open the
# AGENT_BASE bump as a pull request here automatically.
build_from:
  aarch64: ghcr.io/flapperdeflipper/agent-base:1.0.0
  amd64: ghcr.io/flapperdeflipper/agent-base:1.0.0
args:
  AGENT_BASE: "ghcr.io/flapperdeflipper/agent-base:1.0.0"
labels:
  org.opencontainers.image.title: "OpenCode"
  org.opencontainers.image.description: "AI coding agent for Home Assistant"
  org.opencontainers.image.source: "https://github.com/flapperdeflipper/addons"
  org.opencontainers.image.licenses: "Unlicense AND MIT"
  org.opencontainers.image.vendor: "flapperdeflipper"
