---
name: "OpenCode"
description: "AI coding agent for editing Home Assistant configuration with deep MCP integration and LSP support"
version: "3.1.1"
slug: "ha_opencode"
image: "flapperdeflipper/addon-ha-opencode"
url: "https://github.com/magnusoverli/opencode"
arch:
  - aarch64
  - amd64
startup: application
init: false
# Ingress configuration
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:robot
panel_title: OpenCode
ports:
  4096/tcp: null
  8927/tcp: null
ports_description:
  4096/tcp: "OpenCode LAN server (OpenChamber attaches here) — protected by the LAN server password"
  8927/tcp: "Full Home Assistant MCP server over HTTP (streamable, bearer token) — consumed by the mcp-hub add-on"
# File access - Home Assistant config directory
map:
  - type: homeassistant_config
    read_only: false
  - type: local_apps
    read_only: false
  - type: all_app_configs
    read_only: false
    path: /addon_configs
  - type: addon_config
    read_only: false
  - type: share
    read_only: false
# API access - needed for logs, addon discovery, and ingress session creation
hassio_api: true
hassio_role: manager
homeassistant_api: true
# Security and hardware access - keep permissions minimal
host_network: false
privileged: []
uart: false
udev: false
# User-configurable options.
#
# This is a personal fork: everything that used to be an option the owner
# never changes is hardcoded on (full MCP tool profile, native MCP bridge,
# LSP, screenshots, focus mode, install briefing, sensitive-file restriction,
# add-on folder access, CPU auto-detection, terminal appearance). What is
# left is the handful of values that genuinely vary per installation.
options:
  # --- 1. Home Assistant integration -------------------------------------
  # Long-lived access token for direct HA Core API access (screenshots,
  # ESPHome ingress). Create at: Profile -> Long-lived access tokens.
  access_token: ""
  # --- 2. Shared MCP hub (mcp-hub add-on) ---------------------------------
  # Base URL of the mcp-hub add-on, e.g. http://10.20.0.3:8930. Sessions
  # reach the homeassistant MCP (forwarded back to this add-on's 8927
  # endpoint) and the native MCP through it, sharing one server process
  # instead of spawning per-session. Sessions need MCP_HUB_TOKEN in env_vars.
  # Empty = fall back to per-session local stdio servers.
  mcp_hub_url: ""
  # Route ALL MCP traffic through a LiteLLM MCP gateway - the single-tool
  # entrypoint (models + MCP on one host, toolset-scoped virtual keys).
  # Takes precedence over mcp_hub_url; the gateway base URL is extended with
  # /mcp. The gateway is also wired as the model provider (/v1, same key)
  # with runtime model discovery via opencode-plugin-litellm, and
  # glm-5.3/flash-small as the default model pair. Sessions need the
  # toolset key in env_vars under the name configured in mcp_litellm_key_env.
  mcp_litellm_url: ""
  mcp_litellm_key_env: "LITELLM_HASS_KEY"
  # Bearer token this add-on's 8927 MCP endpoint demands. The hub's
  # homeassistant forwarder must be configured with the same value.
  # A !secret <key> value resolves from secrets.yaml at start.
  mcp_http_token: ""
  # --- 3. LAN server (OpenChamber attaches here) ---------------------------
  # Basic-auth password for the LAN server (required; the service refuses to
  # start without one). A !secret <key> value resolves from secrets.yaml.
  server_password: null
  # Browser origin(s) allowed to call the LAN server directly (CORS).
  # Only needed for browser-based clients; the OpenCode CLI does not need this.
  cors_origins: []
  # --- 4. Zigbee2MQTT ------------------------------------------------------
  # Address of the Zigbee2MQTT frontend for zigporter commands. Include
  # http:// or https://; a bare host or IP is treated as http://.
  z2m_url: ""
  z2m_mqtt_topic: "zigbee2mqtt"
  # --- 5. Advanced ---------------------------------------------------------
  # Environment variables to inject into the container
  env_vars: []
  # Custom OpenCode configuration (JSON)
  opencode_config: ""
schema:
  # --- 1. Home Assistant integration -------------------------------------
  access_token: password
  # --- 2. Shared MCP hub (mcp-hub add-on) ---------------------------------
  mcp_hub_url: str?
  mcp_litellm_url: str?
  mcp_litellm_key_env: str
  mcp_http_token: password
  # --- 3. LAN server (OpenChamber attaches here) ---------------------------
  server_password: password
  cors_origins:
    - str
  # --- 4. Zigbee2MQTT ------------------------------------------------------
  z2m_url: str?
  z2m_mqtt_topic: str?
  # --- 5. Advanced ---------------------------------------------------------
  env_vars:
    - name: str
      value: str
  opencode_config: str?
# Exclude caches from backups
backup_exclude:
  - ".npm/*"
  - ".npm-global/*"
  - ".cache/*"
  - ".local/share/opencode/cache/*"
  - ".env_vars"
  - ".env_vars_discovered"
  - "evaluations/*"
  # Generated home context is rebuilt at every start; restoring a stale copy
  # would describe a different installation.
  - "context/*"
  # Startup-hook output can contain credentials from the hook environment.
  - "hooks/*"
