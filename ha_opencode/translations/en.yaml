---
# Field order here is cosmetic — the Home Assistant Configuration tab renders
# fields in the order of the schema block in config.yaml. This file is kept in
# that same order so the two stay easy to diff.
#
# House style for these strings:
#   - Sentence case labels; no "Enable" prefix (a toggle already means that).
#   - The subject is always "OpenCode", never "the AI" or "the model".
#   - State a dependency in the first sentence, naming the option it depends on.
#   - Two sentences where possible, three at most.
#   - No restart instructions (every option needs one) and no changelog voice.
configuration:
  access_token:
    name: "Home Assistant access token"
    description: "Long-lived access token for talking to Home Assistant Core directly. Required by the screenshot tool and by the ESPHome commands — leave empty if you use neither. Create one in Home Assistant under Profile → Long-lived access tokens."

  mcp_hub_url:
    name: "MCP hub URL"
    description: "Base URL of the mcp-hub add-on, for example http://10.20.0.3:8930. OpenCode sessions reach the Home Assistant MCP servers through the hub, sharing one server process instead of spawning their own. Sessions also need MCP_HUB_TOKEN in the environment variables below. Leave empty to fall back to per-session local servers."

  mcp_http_token:
    name: "MCP HTTP bearer token"
    description: "Token this add-on's 8927 MCP endpoint demands. The mcp-hub add-on's homeassistant forwarder must be configured with the same value. A !secret <key> value works too."

  server_password:
    name: "LAN server password"
    description: "Basic-auth password for the LAN server on 4096, which the OpenChamber add-on attaches to. Required; a !secret <key> value works too. Use credentials you share nowhere else — basic auth sends them on every request."

  cors_origins:
    name: "LAN server CORS origins"
    description: "Browser origins allowed to call the LAN server directly, each an exact origin: scheme, host, and port, with no path, for example 'http://192.168.1.20:8080'. 'opencode attach' and OpenChamber do not need an entry."

  z2m_url:
    name: "Zigbee2MQTT URL"
    description: "Address of your Zigbee2MQTT frontend, used by zigporter commands such as 'list-z2m' and 'network-map'. Only needed when the Zigbee2MQTT add-on is not discovered automatically — use the same address and port you open its UI on. Include http:// or https://; a bare host or IP is treated as http://."

  z2m_mqtt_topic:
    name: "Zigbee2MQTT base topic"
    description: "MQTT base topic that Zigbee2MQTT publishes on. Change this only if you changed it in Zigbee2MQTT itself; the default is 'zigbee2mqtt'."

  env_vars:
    name: "Environment variables"
    description: "Extra environment variables for OpenCode and the terminal shell, each with a name and a value. MCP_HUB_TOKEN belongs here when the MCP hub URL above is set. Critical system variables such as HOME, PATH and SUPERVISOR_TOKEN cannot be overridden."

  opencode_config:
    name: "Custom OpenCode configuration"
    description: "A JSON object merged into OpenCode's own configuration, for providers, keybindings, permission rules and similar. Leave empty for the defaults; the full schema is at https://opencode.ai/docs/config."
