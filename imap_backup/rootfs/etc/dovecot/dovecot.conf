# Dovecot 2.4 for the IMAP Backup add-on. Static on purpose: run.sh never edits
# this file, it only prepares what the paths below point at:
#   /run/imap_backup/passwd     accounts from the add-on options (hashed)
#   /run/imap_backup/cert.pem   certfile from /ssl, or the generated self-signed one
#   /run/imap_backup/key.pem
#   /run/imap_backup/debug.conf `debug: true` turns on auth and mail debug logging
#   /mail                       -> /share/<storage_dir>, one Maildir home per account
dovecot_config_version = 2.4.5
dovecot_storage_version = 2.4.5

protocols = imap
listen = *

log_path = /dev/stderr
info_log_path = /dev/stdout
debug_log_path = /dev/stdout

# --- TLS: IMAPS only (993), no plaintext listener ---------------------------
ssl = required
ssl_server_cert_file = /run/imap_backup/cert.pem
ssl_server_key_file = /run/imap_backup/key.pem
ssl_min_protocol = TLSv1.2

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# --- Accounts ---------------------------------------------------------------
auth_mechanisms = plain login
auth_allow_cleartext = no

passdb passwd-file {
  passwd_file_path = /run/imap_backup/passwd
}

# Every account is the same system user; homes live on /share.
userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /mail/%{user}
  }
}
first_valid_uid = 5000
last_valid_uid = 5000

# --- Storage ----------------------------------------------------------------
# Maildir: one file per message, so borg and the hb mirror only move what changed.
# fs layout + "/" separator + UTF-8 names: folders on disk look like they do in
# the mail client (Archive/2019/Receipts), dots in folder names are fine.
mail_driver = maildir
mail_path = ~/Maildir
mailbox_list_layout = fs
mailbox_list_utf8 = yes

namespace inbox {
  inbox = yes
  separator = /

  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}

# Apple Mail opens a connection per mailbox it syncs and per copy it runs in
# parallel; the default of 10 per user+IP makes big drag-and-drop copies fail.
protocol imap {
  mail_max_userip_connections = 50
}

!include_try /run/imap_backup/debug.conf
