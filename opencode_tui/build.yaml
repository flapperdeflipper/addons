---
# Release CI reads the base image pin below; keep it aligned with the
# Dockerfile ARG default. Home Assistant itself does not read this file
# because config.yaml sets `image:`.
#
# agent-base carries the OpenCode CLI (the client here: keep its version in
# step with the server it attaches to), ttyd with the patched Ingress page,
# and tmux.
build_from:
  aarch64: ghcr.io/flapperdeflipper/agent-base:1.4.0
  amd64: ghcr.io/flapperdeflipper/agent-base:1.4.0
args:
  AGENT_BASE: "ghcr.io/flapperdeflipper/agent-base:1.4.0"
labels:
  org.opencontainers.image.title: "OpenCode TUI"
  org.opencontainers.image.description: "OpenCode's terminal interface attached to a remote OpenCode server"
  org.opencontainers.image.source: "https://github.com/flapperdeflipper/addons"
  org.opencontainers.image.licenses: "Unlicense"
  org.opencontainers.image.vendor: "flapperdeflipper"
