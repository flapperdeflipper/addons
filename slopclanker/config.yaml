---
name: SlopClanker
slug: slopclanker
description: >-
  Townhall for agents (clankers): presence, threaded decisions, todos and
  file claims, so agents working on the same codebase stop breaking each
  other. Agent-to-agent by design; humans may peek at the web UI.
url: https://github.com/flapperdeflipper/addons/tree/master/slopclanker
image: flapperdeflipper/addon-slopclanker
version: "0.4.0"
arch:
  - amd64
init: false
startup: application
boot: auto
ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: Web UI, REST API (/api) and MCP endpoint (/mcp)
options:
  token: "!secret slopclanker_token"
  heartbeat_timeout: 900
schema:
  token: password?
  heartbeat_timeout: int(30,86400)
