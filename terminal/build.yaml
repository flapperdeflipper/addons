---
# Release CI passes the args below to the Docker build. BASE_IMAGE pins the
# published OpenCode add-on image this terminal layers on top of; bump it
# together with ha_opencode releases to pick up its toolchain changes.
build_from:
  aarch64: ghcr.io/home-assistant/base-debian:trixie
  amd64: ghcr.io/home-assistant/base-debian:trixie
args:
  BASE_IMAGE: "flapperdeflipper/addon-ha-opencode:2.8.0"
labels:
  org.opencontainers.image.title: "Terminal"
  org.opencontainers.image.description: "Personal bash and vim terminal add-on built on the OpenCode image"
  org.opencontainers.image.source: "https://github.com/flapperdeflipper/addons"
