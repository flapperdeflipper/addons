---
# Release CI passes the args below to the Docker build. AGENT_BASE pins the
# shared base image this terminal layers on top of; releases of
# flapperdeflipper/agent-base open the bump as a pull request automatically.
build_from:
  aarch64: ghcr.io/flapperdeflipper/agent-base:1.0.0
  amd64: ghcr.io/flapperdeflipper/agent-base:1.0.0
args:
  AGENT_BASE: "ghcr.io/flapperdeflipper/agent-base:1.1.0"
labels:
  org.opencontainers.image.title: "Terminal"
  org.opencontainers.image.description: "Personal bash and vim terminal add-on built on the agent-base image"
  org.opencontainers.image.source: "https://github.com/flapperdeflipper/addons"
