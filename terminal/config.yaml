---
name: "Terminal"
description: "A familiar bash and vim environment with your dotfiles and toolset, through Home Assistant Ingress"
version: "1.0.0"
slug: "terminal"
image: "flapperdeflipper/addon-terminal"
url: "https://github.com/flapperdeflipper/addons"
arch:
  - aarch64
  - amd64
startup: services
init: false

# Ingress-only: the terminal is reachable through Home Assistant, no SSH
# server, no exposed ports.
ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:console-terminal
panel_title: Terminal

# Edit the Home Assistant configuration with vim from this shell
map:
  - type: homeassistant_config
    read_only: false

options:
  # --- Terminal appearance -------------------------------------------------
  terminal_theme: "breeze"
  font_size: 14
  cursor_style: "block"
  cursor_blink: false

  # --- Dotfiles and toolset ------------------------------------------------
  # Clone or pull both repositories into /data at every start, then stow the
  # dotfiles profile into the /data home directory.
  sync_dotfiles: true
  dotfiles_repo: "git@github.com:flapperdeflipper/dotfiles.git"
  toolset_repo: "https://github.com/flapperdeflipper/toolset.git"
  # Create /data/.venv and pip install the dotfiles python dependencies
  # (ansible, esphome, ipython, kubernetes, ...). Runs in the background on
  # first start; re-run interactively with: dotfiles-sync
  install_python_deps: true

  # --- Advanced ------------------------------------------------------------
  # Environment variables injected into every shell session. GH_TOKEN here
  # lets the private dotfiles repository clone over HTTPS without a key.
  env_vars: []

schema:
  # --- Terminal appearance -------------------------------------------------
  terminal_theme: list(breeze|catppuccin_mocha|catppuccin_latte|dracula|nord|tokyo_night|one_dark|solarized_dark|solarized_light|gruvbox_dark)
  font_size: int(10,24)
  cursor_style: list(block|underline|bar)
  cursor_blink: bool

  # --- Dotfiles and toolset ------------------------------------------------
  sync_dotfiles: bool
  dotfiles_repo: str
  toolset_repo: str
  install_python_deps: bool

  # --- Advanced ------------------------------------------------------------
  env_vars:
    - name: str
      value: str

# Rebuildable state: the virtualenv is recreated from the dotfiles
# pyproject.toml, the cache directory is scratch space.
backup_exclude:
  - ".cache/*"
  - ".venv/*"
